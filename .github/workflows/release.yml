# Release images (release spec 2026-11-05, section 6). On a v* tag: build ghcr.io/steward-money/steward,
# ghcr.io/steward-money/steward-proxy and ghcr.io/steward-money/steward-gateway for linux/amd64, push them, attach an SPDX SBOM and provenance (buildx), and sign
# each by digest with cosign, keyless. The signature names this workflow and the tag, through GitHub's OIDC token; no
# stored secret is used. Every job runs only in the public repo, steward-money/steward.
# Before any image is built, the notes job checks docs/releases/<version>.md (tag v0.1.2 is 0.1.2) has its four
# sections (scripts/release_notes.py). After the images, the release job publishes the GitHub Release from that file,
# with each image's digest read from the registry.
# To check an image:
#   cosign verify ghcr.io/steward-money/steward:<version> \
#     --certificate-identity-regexp '^https://github\.com/steward-money/steward/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notes:
    if: github.repository == 'steward-money/steward'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py check "$TAG"
  image:
    if: github.repository == 'steward-money/steward'
    needs: notes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: steward
            context: .
            file: Dockerfile
          - image: steward-proxy
            context: deploy/proxy
            file: deploy/proxy/Dockerfile
          - image: steward-gateway
            context: .
            file: deploy/gateway/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the image
        env:
          NAME: ${{ matrix.image }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Sign by digest, keyless
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
  release:
    if: github.repository == 'steward-money/steward'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Write the notes with the image digests
        env:
          TAG: ${{ github.ref_name }}
          IMAGES: steward steward-proxy steward-gateway
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for name in $IMAGES; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${name}:${version}"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "$ref $digest"
          done > "$RUNNER_TEMP/digests"
          python3 scripts/release_notes.py body "$TAG" < "$RUNNER_TEMP/digests" > "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          title="Steward ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
